# The MLCalc web app as a Cloud Run service. docs/deploy-gcp.md explains the setup around it.
# ${PROJECT_ID} and ${TAG} are filled in when deploying (the deploy workflow, or by hand as the
# document shows), then:   gcloud run services replace <filled-in copy> --region europe-north1
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: mlcalc
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # Workspaces live in the server's memory, so all connections of a browser tab must reach
        # the same instance: exactly one instance at most. No instance runs while nobody visits;
        # its workspaces end when it stops, and the page then says so.
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/sessionAffinity: "true"
    spec:
      # Each open page holds one WebSocket, which counts as a request; the server takes 200
      # workspaces (MLCalc__MaxSessions), with room for the page's own file requests.
      containerConcurrency: 250
      # The longest a request may last; it also ends a WebSocket, and the page then reconnects to
      # the same workspace.
      timeoutSeconds: 3600
      # A service account of its own with no roles: the server calls no Google APIs.
      serviceAccountName: mlcalc-web@${PROJECT_ID}.iam.gserviceaccount.com
      containers:
        - image: europe-north1-docker.pkg.dev/${PROJECT_ID}/mlcalc/web:${TAG}
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          env:
            # The limits of appsettings.json, spelled out as in compose.yaml.
            - name: MLCalc__RunSeconds
              value: "60"
            - name: MLCalc__MaxSessions
              value: "200"
            - name: MLCalc__MaxMatrixElements
              value: "2000000"
            - name: MLCalc__MaxPointsPerWindow
              value: "200000"
            - name: MLCalc__MaxOutputEntries
              value: "5000"
            - name: MLCalc__IdleTimeout
              value: "00:30:00"
            # One line per log entry, so that Cloud Logging keeps each entry together (the option
            # only applies when the formatter is named).
            - name: Logging__Console__FormatterName
              value: simple
            - name: Logging__Console__FormatterOptions__SingleLine
              value: "true"
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 1
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
