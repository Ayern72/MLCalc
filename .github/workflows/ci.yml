name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore MLCalc.slnx
      - run: dotnet build MLCalc.slnx --no-restore -c Release
      - run: dotnet test MLCalc.slnx --no-build -c Release
