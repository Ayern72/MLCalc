name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository; give its GitHub token no other rights.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      # Actions are pinned to exact commits, so a moved or compromised tag cannot change what runs.
      # To update, replace the hash with the commit of a newer release and update the comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore MLCalc.slnx
      - run: dotnet build MLCalc.slnx --no-restore -c Release
      - run: dotnet test MLCalc.slnx --no-build -c Release
      # Compile (not run) the benchmark so it keeps building as the code changes.
      - run: dotnet build benchmarks/FunctionEvaluation.cs
      # Build the manual's web page; fails if a link within the page has no target.
      - run: dotnet run tools/build-manual-page/BuildManualPage.cs

      # Downloadable builds of the applications, under Artifacts on the run's page (each one is
      # downloaded as a zip file). Self-contained single files, so that no .NET runtime needs to be
      # installed; the MIT license asks for the license text to go with every copy.
      - name: Publish the applications
        shell: pwsh
        run: |
          $common = @('-c', 'Release', '--self-contained', '-p:PublishSingleFile=true',
            '-p:IncludeNativeLibrariesForSelfExtract=true', '-p:EnableCompressionInSingleFile=true',
            '-p:PublishDocumentationFiles=false', '-p:PublishReferencesDocumentationFiles=false')
          foreach ($app in @(
            @('src/MLCalc.Wpf', 'win-x64', 'desktop-win-x64'),
            @('src/MLCalc.Cli', 'win-x64', 'cli-win-x64'),
            @('src/MLCalc.Cli', 'linux-x64', 'cli-linux-x64'))) {
            dotnet publish $app[0] -r $app[1] -o "publish/$($app[2])" @common
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Copy-Item LICENSE "publish/$($app[2])"
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MLCalc-desktop-win-x64
          path: publish/desktop-win-x64
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mlcalc-cli-win-x64
          path: publish/cli-win-x64
          retention-days: 30
      # Zip files keep no file permissions: on Linux, make the program executable with chmod +x mlcalc.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mlcalc-cli-linux-x64
          path: publish/cli-linux-x64
          retention-days: 30

  # The TypeScript client: type check, tests (including the golden drawings shared with C#), build.
  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/MLCalc.Web.TypeScript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: src/MLCalc.Web.TypeScript/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  # The web app's Docker image builds (Linux containers, so on a Linux runner) and the server in it
  # answers. The image is not pushed anywhere.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t mlcalc-web .
      - name: Start the container and check that it answers
        run: |
          docker run -d --name mlcalc-web -p 8080:8080 --read-only --tmpfs /tmp mlcalc-web
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8080/health; then break; fi
            sleep 1
          done
          curl -fs http://localhost:8080/health
          curl -fs http://localhost:8080/ | grep -q "<title>MLCalc</title>"
          curl -fs -o /dev/null http://localhost:8080/_framework/blazor.webassembly.js
          curl -fs http://localhost:8080/ts/ | grep -q "<title>MLCalc</title>"
      - name: Show the server's log
        if: always()
        run: docker logs mlcalc-web

  # The Android app (src/MLCalc.Maui): a Release APK, under Artifacts on the run's page. On a push
  # to main it is signed with the release key from the repository's secrets, so that each build
  # installs over the one before; elsewhere (pull requests, or before the secrets are set) with a
  # throwaway debug key.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet workload install maui-android
      # The runner's own JDK 21 and Android SDK, with any SDK packages the build needs that it lacks.
      - name: Set up the Android SDK
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          JAVA_HOME="$JAVA_HOME_21_X64" dotnet build src/MLCalc.Maui -t:InstallAndroidDependencies -f net10.0-android \
            -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=True
      - name: Build and sign the APK
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          # The version code grows with every run, as Android requires for an update.
          args=(-f net10.0-android -c Release -o publish/android -p:AndroidPackageFormats=apk
            -p:ApplicationVersion=${{ github.run_number }})
          if [ "$SIGN" = true ] && [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/mlcalc.keystore"
            # env: makes the build read the password from the environment, not the command line.
            args+=(-p:AndroidKeyStore=true -p:AndroidSigningKeyStore="$RUNNER_TEMP/mlcalc.keystore"
              -p:AndroidSigningKeyAlias=mlcalc -p:AndroidSigningKeyPass=env:KEYSTORE_PASSWORD
              -p:AndroidSigningStorePass=env:KEYSTORE_PASSWORD)
          else
            echo "::notice::Not signed with the release key (a pull request, or no ANDROID_KEYSTORE_BASE64 secret)."
          fi
          dotnet publish src/MLCalc.Maui "${args[@]}"
          mkdir -p publish/apk
          cp publish/android/*-Signed.apk publish/apk/MLCalc.apk
          cp LICENSE publish/apk/
          rm -f "$RUNNER_TEMP/mlcalc.keystore"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MLCalc-android
          path: publish/apk
          retention-days: 30
