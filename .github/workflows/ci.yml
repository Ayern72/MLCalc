name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository; give its GitHub token no other rights.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      # Actions are pinned to exact commits, so a moved or compromised tag cannot change what runs.
      # To update, replace the hash with the commit of a newer release and update the comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore MLCalc.slnx
      - run: dotnet build MLCalc.slnx --no-restore -c Release
      - run: dotnet test MLCalc.slnx --no-build -c Release
      # Compile (not run) the benchmark so it keeps building as the code changes.
      - run: dotnet build benchmarks/FunctionEvaluation.cs
      # Build the manual's web page; fails if a link within the page has no target.
      - run: dotnet run tools/build-manual-page/BuildManualPage.cs
