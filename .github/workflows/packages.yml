name: Packages

# Builds the libraries as NuGet packages with a pre-release version and publishes them to the
# repository owner's GitHub Packages registry. Started by hand only (Actions › Packages › Run
# workflow), so that pushes don't use runner time on it.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  pack:
    runs-on: windows-latest
    env:
      # e.g. 0.1.0-preview.7: the version in Directory.Build.props plus the number of this run.
      VERSION_SUFFIX: preview.${{ github.run_number }}
      # Deterministic packages: source paths become /_/ and Source Link points at this commit. Only
      # here, not in Directory.Build.props: tools such as BuildManualPage.cs find the repository
      # from their own source path, which the setting replaces.
      ContinuousIntegrationBuild: true
    steps:
      # Actions are pinned to exact commits, as in ci.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore MLCalc.slnx
      - run: dotnet build MLCalc.slnx --no-restore -c Release --version-suffix ${{ env.VERSION_SUFFIX }}
      # Nothing is published unless the tests pass.
      - run: dotnet test MLCalc.slnx --no-build -c Release
      # Three packages: MLCalc.Numerics, MLCalc.Scripting and MLCalc.Plotting (see Directory.Build.targets).
      - run: dotnet pack MLCalc.slnx --no-build -c Release --version-suffix ${{ env.VERSION_SUFFIX }} -o packages
      # One push per file: on Windows, dotnet nuget push does not expand a wildcard written with a
      # forward slash ("packages/*.nupkg" gives "File does not exist").
      - name: Push to GitHub Packages
        shell: pwsh
        run: |
          foreach ($package in Get-ChildItem packages -Filter *.nupkg) {
            dotnet nuget push $package.FullName --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
