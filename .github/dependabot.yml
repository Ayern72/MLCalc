# Dependabot keeps the dependencies up to date with pull requests, which CI then builds and tests.
# Once a week, with the minor and patch updates of each kind grouped into one pull request; a major
# update comes on its own, as it may need changes. Security updates come as soon as there is one.
version: 2
updates:
  # NuGet packages: their versions are in Directory.Packages.props.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      nuget:
        update-types: [minor, patch]
    ignore:
      # The ASP.NET Core packages follow .NET itself: a new major version comes with a new target
      # framework (net11.0) and SDK, which is a change of its own.
      - dependency-name: Microsoft.AspNetCore.*
        update-types: [version-update:semver-major]

  # The TypeScript client's packages, pinned to exact versions in package.json.
  - package-ecosystem: npm
    directory: /src/MLCalc.Web.TypeScript
    schedule:
      interval: weekly
      day: monday
    versioning-strategy: increase
    groups:
      npm:
        update-types: [minor, patch]

  # The actions in the workflows. They are pinned to commits; Dependabot updates the commit and
  # the version in the comment after it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        update-types: [minor, patch]

  # The Docker base images (.NET SDK and ASP.NET runtime, Node.js).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      # A new .NET major version is a change of the target framework and global.json, not of the
      # image alone; a new Node.js major version is chosen by hand, from the LTS versions.
      # (Dependabot names the images from mcr.microsoft.com without the registry.)
      - dependency-name: dotnet/*
        update-types: [version-update:semver-major]
      - dependency-name: node
        update-types: [version-update:semver-major]
